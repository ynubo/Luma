[package]
name = "hello_world"
version = "0.1.0"
edition = "2021"

[dependencies]
# Подключаем асинхронный движок Tokio со всеми фичами
tokio = { version = "1", features = ["full"] }

# Подключаем фреймворк для Telegram-ботов с поддержкой макросов команд
teloxide = { version = "0.13", features = ["macros"] }
pretty_env_logger = "0.5.0"
dotenvy = "0.15"